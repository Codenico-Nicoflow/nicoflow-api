run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gocyclo
    - gofmt
    - goimports
    - misspell
    - gosimple
    - prealloc
  disable:
    - exhaustive
    - wrapcheck

linters-settings:
  gocyclo:
    min-complexity: 15

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
