      - projects
    patch:
      consumes:
      - application/json
      description: Partial update of a project. Setting areaId moves the project between
        areas (null detaches).
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated project
          schema:
            $ref: '#/definitions/project.ProjectEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "409":
          description: DUPLICATE_NAME
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /projects/{projectId}/tasks:
    get:
      description: Lists the tasks within a project, with optional filtering, sorting
        and case-insensitive ILIKE search over title+notes.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Filter by status (inbox|active|someday|done|cancelled)
        in: query
        name: status
        type: string
      - description: Filter by priority (low|medium|high)
        in: query
        name: priority
        type: string
      - description: Filter by energy (low|medium|deep)
        in: query
        name: energy
        type: string
      - description: ILIKE search over title + notes
        in: query
        name: search
        type: string
      - description: Sort field (displayOrder|scheduledFor|priority|title|createdAt|energy)
        in: query
        name: sortField
        type: string
      - description: Sort order (asc|desc)
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            $ref: '#/definitions/task.TaskListEnvelope'
        "400":
          description: INVALID_INPUT (bad sortField/sortOrder or filter)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List tasks in a project
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Creates a task in a project. Title-only is valid (quick-add); other
        fields default server-side (status=inbox, priority=medium, energy=medium,
        rollsOver=true). Free plan allows 50 active+inbox tasks per project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Task to create (only title is required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT / INVALID_STATUS / INVALID_PRIORITY
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - tasks
  /projects/reorder:
    patch:
      consumes:
      - application/json
      description: Bulk-updates project displayOrder in one transaction (atomic; a
        foreign id rolls the whole batch back).
      parameters:
      - description: New order (id → displayOrder)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.ReorderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Number of rows updated
          schema:
            $ref: '#/definitions/project.ReorderResultEnvelope'
        "404":
          description: PROJECT_NOT_FOUND (a foreign id — whole batch rolled back)
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reorder projects
      tags:
      - projects
  /search:
    get:
      description: Searches the user's tasks, projects and areas via PostgreSQL full-text
        (plainto_tsquery), ranked by relevance.
      parameters:
      - description: Search term (2–100 chars)
        in: query
        name: q
        required: true
        type: string
      - description: 'Comma-separated groups: task,project,area (omit for all)'
        in: query
        name: types
        type: string
      - description: Per-type cap (default 10, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Grouped results
          schema:
            $ref: '#/definitions/search.SearchEnvelope'
        "400":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/search.ErrorEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/search.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Full-text search
      tags:
      - search
  /tasks:
    get:
      description: Flat list of the user's tasks scheduled within an inclusive date
        range, ordered by (scheduledFor, scheduledTime NULLS FIRST, displayOrder).
        Unlike Time Spread no roll-forward is applied — a task is returned on the
        date it is actually scheduled for. Both bounds are required and the span is
        capped at 62 days.
      parameters:
      - description: Inclusive start date (YYYY-MM-DD)
        in: query
        name: scheduledFrom
        required: true
        type: string
      - description: Inclusive end date (YYYY-MM-DD)
        in: query
        name: scheduledTo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tasks in the range
          schema:
            $ref: '#/definitions/task.TaskListEnvelope'
        "422":
          description: INVALID_INPUT (missing bound, bad date, or span > 62 days)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List tasks in a date range (calendar)
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Hard-deletes a task; its subtasks cascade.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Retrieves a single task by ID. Cross-user access returns 404 (no
        existence leak).
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Partial update of any mutable field. status→done sets completedAt
        server-side; moving away from done clears it. A PATCH that moves a task into
        active/inbox is subject to the plan limit.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT / INVALID_STATUS / INVALID_PRIORITY
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - tasks
  /tasks/{id}/reorder:
    patch:
      consumes:
      - application/json
      description: Moves a task to a target displayOrder; siblings in the project
        are repacked to a contiguous 0..n-1 sequence (transactional).
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Target displayOrder
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.ReorderOneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The moved task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reorder a task
      tags:
      - tasks
  /tasks/{id}/schedule:
    patch:
      consumes:
      - application/json
      description: Sets the soft scheduledFor intention, optional scheduledTime (HH:MM,
        Pro-only) and rollsOver flag. scheduledFor null (or absent) unschedules. A
        bad date returns 400 INVALID_DATE.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: scheduledFor (ISO date or null) + optional scheduledTime + rollsOver
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.ScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "400":
          description: INVALID_DATE
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED (free plan setting a time)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (malformed or non-snapped time)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
