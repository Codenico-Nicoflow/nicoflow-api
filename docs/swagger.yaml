  /areas/with-projects:
    get:
      description: Returns every area with its projects nested — the payload the board
        renders from.
      produces:
      - application/json
      responses:
        "200":
          description: Areas with nested projects
          schema:
            $ref: '#/definitions/area.AreaWithProjectsEnvelope'
      security:
      - BearerAuth: []
      summary: List areas with nested projects
      tags:
      - areas
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password. Re-verifies currentPassword
        via bcrypt, enforces the register password policy on newPassword, revokes
        all refresh tokens, and issues a fresh token pair to the caller (every other
        device is signed out; the caller stays signed in). Sets a new HttpOnly refresh
        cookie.
      parameters:
      - description: Current + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New access token + rotated refresh cookie
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "400":
          description: WEAK_PASSWORD
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "401":
          description: UNAUTHORIZED (missing access token or wrong current password)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (password mismatch)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change password (logged in)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password-reset email. Always returns 200 regardless of
        whether the email exists (no user enumeration).
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates by email or username and returns a JWT access token
        plus an HttpOnly refresh cookie. When REQUIRE_EMAIL_VERIFICATION is enabled,
        an unverified account is rejected with 403 EMAIL_NOT_VERIFIED after the password
        check (so verification state is never leaked to a wrong password).
      parameters:
      - description: Credentials (identifier = email or username)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token + user; Set-Cookie refresh token
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "401":
          description: UNAUTHORIZED (invalid credentials; identical for unknown user
            and wrong password)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "403":
          description: EMAIL_NOT_VERIFIED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "429":
          description: RATE_LIMITED (IP limit or account lockout)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the single refresh token carried by the cookie and clears
        it. Authenticates off the HttpOnly refresh cookie, not the access token. Idempotent
        — a missing or already-deleted token still returns 204.
      produces:
      - application/json
      responses:
        "204":
          description: Session ended; refresh cookie cleared
      summary: Log out (current session)
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Revokes every refresh token for the authenticated user. Requires
        a valid access token (revokes by the userID claim).
      produces:
      - application/json
      responses:
        "204":
          description: All sessions revoked; refresh cookie cleared
        "401":
          description: UNAUTHORIZED (missing or invalid access token)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Log out of all devices
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token (delete-old/insert-new) and issues a
        fresh access token. The raw refresh token is read from the HttpOnly cookie
        (preferred) or a JSON body. Replaying a consumed token is reuse and revokes
        all of the user's sessions.
      produces:
      - application/json
      responses:
        "200":
          description: New access token + rotated refresh cookie
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "401":
          description: INVALID_TOKEN (missing, expired, tampered, or already-used)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Refresh the access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user and sends a verification email. Does not log the
        user in — no token is issued and no cookie is set; the user must verify (when
        enforced) then log in.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created (token empty, no session)
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "400":
          description: WEAK_PASSWORD
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "409":
          description: EMAIL_ALREADY_EXISTS or USERNAME_ALREADY_EXISTS
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT or INVALID_EMAIL
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Register a new account
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Re-sends the email-verification link. Always returns 200 (no user
        enumeration).
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Resend the verification email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using the single-use reset token from the email.
        Revokes all active refresh tokens on success.
      parameters:
      - description: Reset token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "400":
          description: WEAK_PASSWORD
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "401":
          description: INVALID_TOKEN (invalid, expired, or already-used)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (e.g. password mismatch)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Reset password with a token
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirms a user's email using the single-use token from the verification
        email.
      parameters:
      - description: Verification token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "401":
          description: INVALID_TOKEN (invalid, expired, or already-used)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Verify email address
      tags:
      - auth
  /bucket:
    get:
      description: Lists the caller's bucket items, newest first. Processed and unprocessed
        items are both returned; the client partitions them into Inbox / Archived.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bucket.BucketListResponse'
      security:
      - BearerAuth: []
      summary: List inbox items
      tags:
      - bucket
    post:
      consumes:
      - application/json
      description: Quick-captures a thought into the bucket. Content is 1–500 characters
        (trimmed).
      parameters:
      - description: Content to capture
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bucket.CreateBucketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bucket.BucketView'
        "422":
          description: INVALID_INPUT
      security:
      - BearerAuth: []
      summary: Capture an inbox item
      tags:
      - bucket
  /bucket/{id}:
    delete:
      description: Hard-deletes a bucket item regardless of processed state.
      parameters:
      - description: Bucket item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: RESOURCE_NOT_FOUND
      security:
      - BearerAuth: []
      summary: Delete an inbox item
      tags:
      - bucket
    get:
      description: Retrieves a single bucket item by ID. Cross-user access returns
        404 (no existence leak).
      parameters:
      - description: Bucket item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bucket.BucketView'
        "404":
          description: RESOURCE_NOT_FOUND
      security:
      - BearerAuth: []
      summary: Get an inbox item
      tags:
      - bucket
    patch:
      consumes:
      - application/json
      description: Edits the content of an unprocessed bucket item. Editing a processed
        item returns 409.
      parameters:
      - description: Bucket item ID
        in: path
        name: id
        required: true
        type: string
      - description: New content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bucket.UpdateBucketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bucket.BucketView'
        "404":
          description: RESOURCE_NOT_FOUND
        "409":
          description: CONFLICT (already processed)
        "422":
          description: INVALID_INPUT
      security:
      - BearerAuth: []
      summary: Edit an unprocessed inbox item
      tags:
      - bucket
  /bucket/{id}/process:
    post:
      consumes:
      - application/json
      description: Converts an unprocessed item into a task (requires projectId +
        taskDetails), trashes it, or (note — not yet implemented) returns 501. Already-processed
        items return 409.
      parameters:
      - description: Bucket item ID
        in: path
        name: id
        required: true
        type: string
      - description: How to process the item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bucket.ProcessBucketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bucket.BucketView'
        "403":
          description: PLAN_LIMIT_EXCEEDED
        "404":
          description: RESOURCE_NOT_FOUND / PROJECT_NOT_FOUND
        "409":
          description: CONFLICT (already processed)
        "422":
          description: INVALID_INPUT
        "501":
          description: note processing not implemented
      security:
      - BearerAuth: []
      summary: Process an inbox item
      tags:
      - bucket
  /calendar/google-events:
    get:
      description: Read-only overlay of the user's selected Google calendars for an
        inclusive date range (max 62 days). Never returns 5xx for a Google-side failure
        — the response carries `googleStatus` (`ok`|`disconnected`|`error`) with an
        empty list instead, so a Google outage cannot break the calendar view. `refresh=true`
        bypasses the short server-side cache.
      parameters:
      - description: Inclusive start date (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: Inclusive end date (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Bypass the cache and re-query Google
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/googlecal.EventsResponse'
        "422":
          description: INVALID_INPUT (missing bound, bad date, or span > 62 days)
          schema:
            $ref: '#/definitions/googlecal.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List Google Calendar events
      tags:
      - calendar
  /calendar/google/calendars:
    get:
      description: The calendars the user can read, each flagged with whether it currently
        overlays the Nicoflow calendar. A connection with no stored selection reports
        the primary calendar as selected, matching the overlay's default.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/googlecal.CalendarView'
            type: array
        "409":
          description: GOOGLE_NOT_CONNECTED
          schema:
            $ref: '#/definitions/googlecal.ErrorEnvelope'
        "502":
          description: GOOGLE_AUTH_FAILED — Google unreachable
          schema:
            $ref: '#/definitions/googlecal.ErrorEnvelope'
        "503":
          description: GOOGLE_AUTH_FAILED — integration not configured
          schema:
            $ref: '#/definitions/googlecal.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List the user's Google calendars
      tags:
      - calendar
    put:
      consumes:
      - application/json
      description: Replaces the overlay selection. Capped at 5 calendars — each selected
        calendar is a separate Google API call per ranged fetch. Duplicates are collapsed
        rather than rejected. Returns the full calendar list with the new selection
        applied.
      parameters:
      - description: Calendar IDs to select
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/googlecal.UpdateSelectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/googlecal.CalendarView'
            type: array
        "409":
          description: GOOGLE_NOT_CONNECTED
          schema:
            $ref: '#/definitions/googlecal.ErrorEnvelope'
        "422":
          description: INVALID_INPUT — missing field, empty ID, or more than 5 calendars
          schema:
            $ref: '#/definitions/googlecal.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Replace the selected calendars
      tags:
      - calendar
  /focus:
    get:
      description: 'Returns a deterministically-ranked short list of the user''s active+inbox
        tasks (across all projects) that fit the given time/energy. Scoring: energy
        match, time-budget fit (over-budget excluded), due/overdue escalation, scheduled
        proximity, priority tiebreak.'
      parameters:
      - description: Minutes available (over-budget tasks excluded)
        in: query
        name: available
        type: integer
      - description: Current energy (low|medium|deep)
        in: query
        name: energy
        type: string
      - description: Max results (default 5, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ranked tasks
          schema:
            $ref: '#/definitions/task.TaskListEnvelope'
        "400":
          description: INVALID_INPUT (bad available/energy/limit)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Focus — what can I do right now?
      tags:
      - tasks
  /notes:
    get:
      description: Returns the project's notes ordered by updated_at DESC. Each item
        carries a 200-char excerpt and NO content — never render a note body from
        this response. Notes are Free and unlimited.
      parameters:
      - description: Project to list notes for
        in: query
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notes with excerpts
          schema:
            $ref: '#/definitions/note.NoteListEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND (project missing or not owned)
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (projectId missing)
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List a project's notes
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Files a new note under a project. content is optional (defaults
        to an empty document). content_text is always server-derived — a client-sent
        value is rejected. Notes are Free and unlimited; this endpoint never returns
        PLAN_LIMIT_EXCEEDED. Bodies over 1 MB are refused.
      parameters:
      - description: Note to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/note.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created note
          schema:
            $ref: '#/definitions/note.NoteDetailEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND (project missing or not owned)
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (bad title/content/projectId, or body over 1
            MB)
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a note
      tags:
      - notes
  /notes/{id}:
    delete:
      description: Hard-deletes a note. Cross-user access returns 404, never 403.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a note
      tags:
      - notes
    get:
      description: Retrieves a single note including its full document. Cross-user
        access returns 404, never 403.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The note with its content
          schema:
            $ref: '#/definitions/note.NoteDetailEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a note
      tags:
      - notes
    patch:
      consumes:
      - application/json
      description: Partial update guarded by optimistic concurrency. version is REQUIRED
        and must match the stored row; a stale version returns 409 and writes nothing.
        On 409 a client must surface a conflict state and stop autosaving — never
        retry silently. A successful save increments version.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change plus the version last read
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/note.UpdateNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated note at its new version
          schema:
            $ref: '#/definitions/note.NoteDetailEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
        "409":
          description: CONFLICT (stale version — the note moved on)
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (missing version, bad title/content, or body
            over 1 MB)
          schema:
            $ref: '#/definitions/note.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a note
      tags:
      - notes
  /notifications:
    get:
      description: Lists the user's notifications, cursor-paginated, newest first,
        with an optional read filter.
      parameters:
      - description: Filter by read state
        in: query
        name: isRead
        type: boolean
      - description: Page size (1–100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated notifications
          schema:
            $ref: '#/definitions/notification.NotificationListEnvelope'
        "400":
          description: INVALID_INPUT (bad limit/cursor)
          schema:
            $ref: '#/definitions/notification.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - notifications
  /notifications/{id}:
    delete:
      description: Hard-deletes a notification. Cross-user access returns 404.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: NOTIFICATION_NOT_FOUND
          schema:
            $ref: '#/definitions/notification.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Dismiss a notification
      tags:
      - notifications
  /notifications/{id}/read:
    patch:
      description: Marks a single notification read. Cross-user access returns 404.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The updated notification
          schema:
            $ref: '#/definitions/notification.NotificationEnvelope'
        "404":
          description: NOTIFICATION_NOT_FOUND
          schema:
            $ref: '#/definitions/notification.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Mark a notification read
      tags:
      - notifications
  /notifications/preferences:
    get:
      description: Returns the user's notification preferences. An absent row yields
        the defaults ({ emailDigest:true, pushEnabled:false, smsEnabled:false, beforeDueMinutes:1440,
        afterDueMinutes:0 }). Push/SMS toggles are stored but inert until E-037.
      produces:
      - application/json
      responses:
        "200":
          description: The user's preferences
          schema:
            $ref: '#/definitions/notification.PreferencesEnvelope'
      security:
      - BearerAuth: []
      summary: Get notification preferences
      tags:
      - notifications
    put:
      consumes:
      - application/json
      description: Partially or fully updates the user's notification preferences
        (lazy upsert). Lead-time minutes must be 0–10080. Push/SMS toggles persist
        but have no delivery path until E-037.
      parameters:
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notification.UpdatePreferences'
      produces:
      - application/json
      responses:
        "200":
          description: The updated preferences
          schema:
            $ref: '#/definitions/notification.PreferencesEnvelope'
        "400":
          description: INVALID_INPUT (bad body or lead time out of range)
          schema:
            $ref: '#/definitions/notification.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update notification preferences
      tags:
      - notifications
  /notifications/push/subscribe:
    delete:
      consumes:
      - application/json
      description: Removes the user's Web Push subscription for the given endpoint.
        Idempotent.
      parameters:
      - description: Endpoint to remove
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notification.SubscribeRequest'
      responses:
        "204":
          description: Subscription removed
      security:
      - BearerAuth: []
      summary: Unsubscribe from web push
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: Stores a browser Web Push subscription for the user (Pro-only).
        Upserts on endpoint. Free-plan callers get PLAN_LIMIT_EXCEEDED.
      parameters:
      - description: Push subscription (endpoint + keys)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notification.SubscribeRequest'
      responses:
        "201":
          description: Subscription stored
        "403":
          description: PLAN_LIMIT_EXCEEDED (free plan)
          schema:
            $ref: '#/definitions/notification.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (missing endpoint/keys)
          schema:
            $ref: '#/definitions/notification.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Subscribe to web push
      tags:
      - notifications
  /notifications/read-all:
    patch:
      description: Marks every unread notification read and returns how many were
        updated.
      produces:
      - application/json
      responses:
        "200":
          description: Number marked read
          schema:
            $ref: '#/definitions/notification.CountEnvelope'
      security:
      - BearerAuth: []
      summary: Mark all notifications read
      tags:
      - notifications
  /notifications/unread-count:
    get:
      description: Returns the number of unread notifications — the cheap poll target
        for the bell badge.
      produces:
      - application/json
      responses:
        "200":
          description: Unread count
          schema:
            $ref: '#/definitions/notification.UnreadCountEnvelope'
      security:
      - BearerAuth: []
      summary: Unread notification count
      tags:
      - notifications
  /projects:
    get:
      description: Lists the user's projects across all areas, cursor-paginated, with
        optional filters.
      parameters:
      - description: Search by project name
        in: query
        name: q
        type: string
      - description: Filter by area
        in: query
        name: areaId
        type: string
      - description: Filter by status (active|completed|archived)
        in: query
        name: status
        type: string
      - description: Filter by favorite
        in: query
        name: isFavorite
        type: boolean
      - description: Page size (1–100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated projects
          schema:
            $ref: '#/definitions/project.ProjectListEnvelope'
        "400":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
  /projects/{id}:
    delete:
      description: Deletes a project; its tasks are cascade-deleted.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      description: Retrieves a single project by ID. Cross-user access returns 404.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The project
          schema:
            $ref: '#/definitions/project.ProjectEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a project
