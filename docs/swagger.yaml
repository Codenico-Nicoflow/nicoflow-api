host: localhost:8080
info:
  contact: {}
  description: REST API for the Nicoflow productivity platform
  title: Nicoflow API
  version: "1.0"
paths:
  /ai/sessions:
    get:
      description: Returns all AI conversation sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.AISessionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List AI sessions
      tags:
      - ai
    post:
      description: Creates a new AI conversation session for the authenticated user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/swaggertypes.AISessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an AI session
      tags:
      - ai
  /ai/sessions/{id}:
    delete:
      description: Deletes an AI conversation session owned by the authenticated user
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.EmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an AI session
      tags:
      - ai
  /ai/sessions/{sessionId}/messages:
    get:
      description: Returns all messages in the specified AI conversation session
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.AIMessageListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List messages in a session
      tags:
      - ai
    post:
      consumes:
      - application/json
      description: Sends a message in an AI conversation session and returns the assistant
        reply
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Message content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swaggertypes.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/swaggertypes.AIMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - ai
  /areas:
    get:
      description: Returns all areas belonging to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.AreaListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List areas
      tags:
      - areas
    post:
      consumes:
      - application/json
      description: Creates a new area for the authenticated user
      parameters:
      - description: Area data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swaggertypes.CreateAreaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/swaggertypes.AreaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an area
      tags:
      - areas
  /areas/{id}:
    delete:
      description: Deletes an area owned by the authenticated user
      parameters:
      - description: Area ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.EmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an area
      tags:
      - areas
    put:
      consumes:
      - application/json
      description: Updates the name of an area owned by the authenticated user
      parameters:
      - description: Area ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated area data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swaggertypes.UpdateAreaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.AreaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an area
      tags:
      - areas
  /attachments/download-url:
    post:
      consumes:
      - application/json
      description: Returns a pre-signed S3 URL to download a file attachment
      parameters:
      - description: S3 object key
        in: body
        name: body
        required: true
        schema:
