          description: The created subtask
          schema:
            $ref: '#/definitions/task.SubtaskEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND (task not found / not owned)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a subtask
      tags:
      - subtasks
  /tasks/{taskId}/subtasks/{subtaskId}:
    delete:
