      - description: Parent task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: Subtask ID
        in: path
        name: subtaskId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a subtask
      tags:
      - subtasks
    patch:
      consumes:
      - application/json
      description: Partial update of a subtask (title, done, position). Parent-task
