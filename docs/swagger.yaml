        in: query
        name: tz
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Three-bucket task lists
          schema:
            $ref: '#/definitions/task.TimeSpreadEnvelope'
        "400":
          description: INVALID_INPUT — unknown timezone
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Time spread (today / tomorrow / this week)
      tags:
      - tasks
  /users/me:
    delete:
      description: Soft-deletes the authenticated user (sets deleted_at) and revokes
        all refresh tokens.
      produces:
      - application/json
      responses:
        "204":
          description: Account deleted; all sessions revoked
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete the current account
      tags:
      - users
    patch:
