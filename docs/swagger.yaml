      parameters:
      - description: Parent task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: Subtask ID
        in: path
        name: subtaskId
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateSubtaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated subtask
          schema:
            $ref: '#/definitions/task.SubtaskEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a subtask
      tags:
      - subtasks
  /time-spread:
    get:
      description: Buckets the user's active+inbox tasks into today/tomorrow/thisWeek
        with the no-guilt roll-forward (a past soft-scheduled task with rollsOver=true
        carries to today instead of going overdue). someday/done/cancelled are excluded.
      parameters:
