  /attachments/upload-url:
    post:
      consumes:
      - application/json
      description: Returns a pre-signed S3 URL to upload a file attachment
      parameters:
      - description: File name to upload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swaggertypes.UploadURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swaggertypes.URLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swaggertypes.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get S3 upload URL
      tags:
      - attachments
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access + refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
