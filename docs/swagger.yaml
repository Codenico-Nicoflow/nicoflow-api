info:
  contact: {}
  description: REST API for the Nicoflow GTD task-management platform. Covers authentication
    & user management, Areas, Projects, Tasks (CRUD, quick actions, filter/sort/search),
    Subtasks, Focus and Time-Spread.
  title: Nicoflow API
  version: "1.0"
paths:
  /areas:
    get:
      description: Lists the user's areas, cursor-paginated, with optional name search.
      parameters:
      - description: Search by area name
        in: query
        name: q
        type: string
      - description: Page size (1–100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated areas
          schema:
            $ref: '#/definitions/area.AreaListEnvelope'
        "400":
          description: INVALID_INPUT (bad limit/cursor)
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List areas
      tags:
      - areas
    post:
      consumes:
      - application/json
      description: Creates an area. Free plan allows up to 3 areas.
      parameters:
      - description: Area to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/area.CreateAreaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created area
          schema:
            $ref: '#/definitions/area.AreaEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
        "409":
          description: DUPLICATE_NAME
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create an area
      tags:
      - areas
  /areas/{areaId}/projects:
    get:
      description: Lists the projects within one area, cursor-paginated, with optional
        filters.
      parameters:
      - description: Area ID
        in: path
        name: areaId
        required: true
        type: string
      - description: Search by project name
        in: query
        name: q
        type: string
      - description: Filter by status (active|completed|archived)
        in: query
        name: status
        type: string
      - description: Filter by favorite
        in: query
        name: isFavorite
        type: boolean
      - description: Page size (1–100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated projects
          schema:
            $ref: '#/definitions/project.ProjectListEnvelope'
        "400":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List projects in an area
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Creates a project inside an area. Free plan allows up to 5 projects
        total.
      parameters:
      - description: Area ID
        in: path
        name: areaId
        required: true
        type: string
      - description: Project to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created project
          schema:
            $ref: '#/definitions/project.ProjectEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "404":
          description: AREA_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "409":
          description: DUPLICATE_NAME
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /areas/{id}:
    delete:
      description: Deletes an area; its projects are cascade-deleted (their tasks
        survive unfiled).
      parameters:
      - description: Area ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: AREA_NOT_FOUND
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete an area
      tags:
      - areas
    get:
      description: Retrieves a single area by ID. Cross-user access returns 404.
      parameters:
      - description: Area ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The area
          schema:
            $ref: '#/definitions/area.AreaEnvelope'
        "404":
          description: AREA_NOT_FOUND
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get an area
      tags:
      - areas
    patch:
      consumes:
      - application/json
      description: Partial update of an area (name, color, icon).
      parameters:
      - description: Area ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/area.UpdateAreaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated area
          schema:
            $ref: '#/definitions/area.AreaEnvelope'
        "404":
          description: AREA_NOT_FOUND
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
        "409":
          description: DUPLICATE_NAME
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update an area
      tags:
      - areas
  /areas/reorder:
    patch:
      consumes:
      - application/json
      description: Bulk-updates area displayOrder in one transaction (atomic; a foreign
        id rolls the whole batch back).
      parameters:
      - description: New order (id → displayOrder)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/area.ReorderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Number of rows updated
          schema:
            $ref: '#/definitions/area.ReorderResultEnvelope'
        "404":
          description: AREA_NOT_FOUND (a foreign id — whole batch rolled back)
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reorder areas
      tags:
      - areas
  /areas/with-projects:
    get:
      description: Returns every area with its projects nested — the payload the board
        renders from.
      produces:
      - application/json
      responses:
        "200":
          description: Areas with nested projects
          schema:
            $ref: '#/definitions/area.AreaWithProjectsEnvelope'
      security:
      - BearerAuth: []
      summary: List areas with nested projects
      tags:
      - areas
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password-reset email. Always returns 200 regardless of
        whether the email exists (no user enumeration).
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates by email or username and returns a JWT access token
        plus an HttpOnly refresh cookie. When REQUIRE_EMAIL_VERIFICATION is enabled,
        an unverified account is rejected with 403 EMAIL_NOT_VERIFIED after the password
        check (so verification state is never leaked to a wrong password).
      parameters:
      - description: Credentials (identifier = email or username)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token + user; Set-Cookie refresh token
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "401":
          description: UNAUTHORIZED (invalid credentials; identical for unknown user
            and wrong password)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "403":
          description: EMAIL_NOT_VERIFIED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "429":
          description: RATE_LIMITED (IP limit or account lockout)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the single refresh token carried by the cookie and clears
        it. Authenticates off the HttpOnly refresh cookie, not the access token. Idempotent
        — a missing or already-deleted token still returns 204.
      produces:
      - application/json
      responses:
        "204":
          description: Session ended; refresh cookie cleared
      summary: Log out (current session)
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Revokes every refresh token for the authenticated user. Requires
        a valid access token (revokes by the userID claim).
      produces:
      - application/json
      responses:
        "204":
          description: All sessions revoked; refresh cookie cleared
        "401":
          description: UNAUTHORIZED (missing or invalid access token)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Log out of all devices
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token (delete-old/insert-new) and issues a
        fresh access token. The raw refresh token is read from the HttpOnly cookie
        (preferred) or a JSON body. Replaying a consumed token is reuse and revokes
        all of the user's sessions.
      produces:
      - application/json
      responses:
        "200":
          description: New access token + rotated refresh cookie
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "401":
          description: INVALID_TOKEN (missing, expired, tampered, or already-used)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Refresh the access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user and sends a verification email. Does not log the
        user in — no token is issued and no cookie is set; the user must verify (when
        enforced) then log in.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created (token empty, no session)
          schema:
            $ref: '#/definitions/auth.AuthEnvelope'
        "400":
          description: WEAK_PASSWORD
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "409":
          description: EMAIL_ALREADY_EXISTS or USERNAME_ALREADY_EXISTS
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT or INVALID_EMAIL
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Register a new account
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Re-sends the email-verification link. Always returns 200 (no user
        enumeration).
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Resend the verification email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using the single-use reset token from the email.
        Revokes all active refresh tokens on success.
      parameters:
      - description: Reset token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "400":
          description: WEAK_PASSWORD
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "401":
          description: INVALID_TOKEN (invalid, expired, or already-used)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT (e.g. password mismatch)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Reset password with a token
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirms a user's email using the single-use token from the verification
        email.
      parameters:
      - description: Verification token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "401":
          description: INVALID_TOKEN (invalid, expired, or already-used)
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      summary: Verify email address
      tags:
      - auth
  /focus:
    get:
      description: 'Returns a deterministically-ranked short list of the user''s active+inbox
        tasks (across all projects) that fit the given time/energy. Scoring: energy
        match, time-budget fit (over-budget excluded), due/overdue escalation, scheduled
        proximity, priority tiebreak.'
      parameters:
      - description: Minutes available (over-budget tasks excluded)
        in: query
        name: available
        type: integer
      - description: Current energy (low|medium|deep)
        in: query
        name: energy
        type: string
      - description: Max results (default 5, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ranked tasks
          schema:
            $ref: '#/definitions/task.TaskListEnvelope'
        "400":
          description: INVALID_INPUT (bad available/energy/limit)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Focus — what can I do right now?
      tags:
      - tasks
  /projects:
    get:
      description: Lists the user's projects across all areas, cursor-paginated, with
        optional filters.
      parameters:
      - description: Search by project name
        in: query
        name: q
        type: string
      - description: Filter by area
        in: query
        name: areaId
        type: string
      - description: Filter by status (active|completed|archived)
        in: query
        name: status
        type: string
      - description: Filter by favorite
        in: query
        name: isFavorite
        type: boolean
      - description: Page size (1–100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated projects
          schema:
            $ref: '#/definitions/project.ProjectListEnvelope'
        "400":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
  /projects/{id}:
    delete:
      description: Deletes a project; its tasks are cascade-deleted.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      description: Retrieves a single project by ID. Cross-user access returns 404.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The project
          schema:
            $ref: '#/definitions/project.ProjectEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Partial update of a project. Setting areaId moves the project between
        areas (null detaches).
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated project
          schema:
            $ref: '#/definitions/project.ProjectEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "409":
          description: DUPLICATE_NAME
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /projects/{projectId}/tasks:
    get:
      description: Lists the tasks within a project, with optional filtering, sorting
        and case-insensitive ILIKE search over title+notes.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Filter by status (inbox|active|someday|done|cancelled)
        in: query
        name: status
        type: string
      - description: Filter by priority (low|medium|high)
        in: query
        name: priority
        type: string
      - description: Filter by energy (low|medium|deep)
        in: query
        name: energy
        type: string
      - description: ILIKE search over title + notes
        in: query
        name: search
        type: string
      - description: Sort field (displayOrder|scheduledFor|priority|title|createdAt|energy)
        in: query
        name: sortField
        type: string
      - description: Sort order (asc|desc)
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            $ref: '#/definitions/task.TaskListEnvelope'
        "400":
          description: INVALID_INPUT (bad sortField/sortOrder or filter)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List tasks in a project
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Creates a task in a project. Title-only is valid (quick-add); other
        fields default server-side (status=inbox, priority=medium, energy=medium,
        rollsOver=true). Free plan allows 50 active+inbox tasks per project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Task to create (only title is required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: PROJECT_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT / INVALID_STATUS / INVALID_PRIORITY
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - tasks
  /projects/reorder:
    patch:
      consumes:
      - application/json
      description: Bulk-updates project displayOrder in one transaction (atomic; a
        foreign id rolls the whole batch back).
      parameters:
      - description: New order (id → displayOrder)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.ReorderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Number of rows updated
          schema:
            $ref: '#/definitions/project.ReorderResultEnvelope'
        "404":
          description: PROJECT_NOT_FOUND (a foreign id — whole batch rolled back)
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/project.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reorder projects
      tags:
      - projects
  /tasks/{id}:
    delete:
      description: Hard-deletes a task; its subtasks cascade.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Retrieves a single task by ID. Cross-user access returns 404 (no
        existence leak).
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Partial update of any mutable field. status→done sets completedAt
        server-side; moving away from done clears it. A PATCH that moves a task into
        active/inbox is subject to the plan limit.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT / INVALID_STATUS / INVALID_PRIORITY
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - tasks
  /tasks/{id}/reorder:
    patch:
      consumes:
      - application/json
      description: Moves a task to a target displayOrder; siblings in the project
        are repacked to a contiguous 0..n-1 sequence (transactional).
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Target displayOrder
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.ReorderOneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The moved task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reorder a task
      tags:
      - tasks
  /tasks/{id}/schedule:
    patch:
      consumes:
      - application/json
      description: Sets the soft scheduledFor intention + rollsOver flag. scheduledFor
        null (or absent) unschedules. A bad date returns 400 INVALID_DATE.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: scheduledFor (ISO date or null) + optional rollsOver
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.ScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "400":
          description: INVALID_DATE
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Schedule a task (soft)
      tags:
      - tasks
  /tasks/{id}/status:
    patch:
      consumes:
      - application/json
      description: Status-only update (checkbox toggle, move to someday). Same completedAt
        side-effects and plan-limit semantics as the full PATCH.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.SetStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT / INVALID_STATUS
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Set task status (shorthand)
      tags:
      - tasks
  /tasks/{taskId}/subtasks:
    get:
      description: Lists a task's subtasks, ordered by position. Parent-task ownership
        is enforced.
      parameters:
      - description: Parent task ID
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of subtasks
          schema:
            $ref: '#/definitions/task.SubtaskListEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND (task not found / not owned)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List subtasks
      tags:
      - subtasks
    post:
      consumes:
      - application/json
      description: Creates a subtask under a task. Appends to the end unless position
        is given.
      parameters:
      - description: Parent task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: Subtask (title required, position optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.CreateSubtaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: The created subtask
          schema:
            $ref: '#/definitions/task.SubtaskEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND (task not found / not owned)
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a subtask
      tags:
      - subtasks
  /tasks/{taskId}/subtasks/{subtaskId}:
    delete:
      description: Deletes a subtask. Parent-task ownership enforced.
      parameters:
      - description: Parent task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: Subtask ID
        in: path
        name: subtaskId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a subtask
      tags:
      - subtasks
    patch:
      consumes:
      - application/json
      description: Partial update of a subtask (title, done, position). Parent-task
        ownership enforced.
      parameters:
      - description: Parent task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: Subtask ID
        in: path
        name: subtaskId
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateSubtaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated subtask
          schema:
            $ref: '#/definitions/task.SubtaskEnvelope'
        "404":
          description: RESOURCE_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a subtask
      tags:
      - subtasks
  /time-spread:
    get:
      description: Buckets the user's active+inbox tasks into today/tomorrow/thisWeek
        with the no-guilt roll-forward (a past soft-scheduled task with rollsOver=true
        carries to today instead of going overdue). someday/done/cancelled are excluded.
      produces:
      - application/json
      responses:
        "200":
          description: Three-bucket task lists
          schema:
            $ref: '#/definitions/task.TimeSpreadEnvelope'
      security:
      - BearerAuth: []
      summary: Time spread (today / tomorrow / this week)
      tags:
      - tasks
  /users/me:
    delete:
      description: Soft-deletes the authenticated user (sets deleted_at) and revokes
        all refresh tokens.
      produces:
      - application/json
      responses:
        "204":
          description: Account deleted; all sessions revoked
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete the current account
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Updates profile fields. All fields are optional; omitted fields
        are left unchanged.
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
        "422":
          description: INVALID_INPUT or INVALID_EMAIL
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - users
  /users/profile:
    get:
      description: Returns the authenticated user's profile.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/auth.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: JWT access token as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
