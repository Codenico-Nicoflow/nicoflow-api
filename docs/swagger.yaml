          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
        "422":
          description: INVALID_INPUT
          schema:
            $ref: '#/definitions/area.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reorder areas
      tags:
