      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.SetStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The updated task
          schema:
            $ref: '#/definitions/task.TaskEnvelope'
        "403":
          description: PLAN_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "404":
          description: TASK_NOT_FOUND
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
        "422":
          description: INVALID_INPUT / INVALID_STATUS
          schema:
            $ref: '#/definitions/task.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Set task status (shorthand)
      tags:
      - tasks
  /tasks/{taskId}/subtasks:
    get:
