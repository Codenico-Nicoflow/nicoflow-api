# Render Blueprint — Nicoflow API (staging)
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions the staging web service + a managed Postgres 16 instance.
# Apply via the Render dashboard: New + → Blueprint → point at this repo.
#
# Notes:
# - DB migrations run automatically on boot (see internal/db/migrate.go); opt out with SKIP_MIGRATIONS=true.
# - Secrets (sync: false) are intentionally left blank here and entered in the dashboard.
# - Production is deliberately omitted for now (staging-first); clone this service block
#   with prod values once staging is verified green.

databases:
  - name: nicoflow-db-staging
    databaseName: nicoflow
    user: nicoflow
    # Region MUST match the web service below — the API connects over Render's private
    # network using the DB's internal hostname, which only resolves within the same region.
    region: frankfurt
    # Free Postgres expires (~30 days) and is then deleted. Plan: upgrade to `starter`
    # (~$7/mo, persistent) before expiry if staging is still in use — one-line change,
    # no rebuild/migration needed. Until then it holds only throwaway test data.
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: nicoflow-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Must match the database region above so the internal DB hostname resolves.
    region: frankfurt
    branch: staging
    autoDeploy: true
    healthCheckPath: /v1/health
    envVars:
      # --- wired automatically from the managed database above ---
      - key: DATABASE_URL
        fromDatabase:
          name: nicoflow-db-staging
          property: connectionString

      # --- environment / behaviour ---
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      # Cross-site cookie: frontend (*.vercel.app) and API (*.onrender.com) are different
      # registrable domains, so the refresh cookie must be SameSite=None. Flip to false once
      # both sit on one custom domain (then the cookie returns to SameSite=Strict).
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"

      # Observability (E-038): Sentry error tracking. Absent DSN = no-op, so this
      # stays blank until the epic lands. When cloning this block for the prod
      # service, carry LOG_LEVEL + SENTRY_DSN across.
      - key: SENTRY_DSN
        sync: false

      # --- token TTLs (defaults; here for visibility) ---
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 168h

      # --- secrets / per-environment values: set in the Render dashboard ---
      - key: JWT_SECRET
        sync: false
      # Exact Vercel staging origin, no trailing slash, no wildcard (must match the FE origin):
      - key: CORS_ORIGINS
        sync: false
      # E2E rate-limit bypass token (staging only). A request with header
      # `X-E2E-Bypass: <this>` skips the rate limiters so the live E2E suite
      # isn't throttled. NEVER set this on production. Unset ⇒ no bypass.
      - key: RATE_LIMIT_BYPASS_TOKEN
        sync: false
      # Same Vercel origin — used to build verify-email / reset-password links:
      - key: APP_BASE_URL
        sync: false
      # Mailtrap (or other) SMTP DSN so verification/reset emails are sent:
      - key: SMTP_DSN
        sync: false
      # Shared secret guarding POST /internal/jobs/* — must match the cron job's
      # value below (set the same secret on both in the dashboard). Unset ⇒ the
      # internal endpoints return 503.
      - key: CRON_SECRET
        sync: false
      # Web Push VAPID keys (E-025). Base64url; all three unset ⇒ push no-op.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # ── Due-date reminder sweep (E-020) ─────────────────────────────────────────
  # Hourly cron that POSTs the internal endpoint; the sweep itself decides which
  # users are at their local 08:00. -f makes a non-2xx response fail the run (so
  # Render surfaces it). API_HOST is wired from the web service; CRON_SECRET must
  # match the web service's value (set the same secret on both in the dashboard).
  - type: cron
    name: nicoflow-due-notify-staging
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.1
    region: frankfurt
    schedule: "0 * * * *"
    startCommand: >
      curl -fsS -X POST "https://$API_HOST/internal/jobs/due-notify"
      -H "X-Internal-Token: $CRON_SECRET"
    envVars:
      - key: API_HOST
        fromService:
          name: nicoflow-api-staging
          type: web
          property: host
      - key: CRON_SECRET
        sync: false

  # ── Overdue-task reminder sweep (E-025 / NIC-1566) ──────────────────────────
  # Hourly cron; the sweep fires only for users at their local reminder hour and
  # dedupes per task/day, so hourly invocation is safe. Same guard + host wiring
  # as the due-notify cron above.
  - type: cron
    name: nicoflow-overdue-staging
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.1
    region: frankfurt
    schedule: "0 * * * *"
    startCommand: >
      curl -fsS -X POST "https://$API_HOST/internal/jobs/overdue"
      -H "X-Internal-Token: $CRON_SECRET"
    envVars:
      - key: API_HOST
        fromService:
          name: nicoflow-api-staging
          type: web
          property: host
      - key: CRON_SECRET
        sync: false

  # ── Start-of-day sweep (E-025 / NIC-1570) ───────────────────────────────────
  # Hourly cron; the sweep fires only for users at their local 08:00 and dedupes
  # per user/day, so hourly invocation is safe. Emits the FREE scheduled-today
  # summary and the Pro plan-your-day nudge. Same guard + host wiring as above.
  - type: cron
    name: nicoflow-day-start-staging
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.1
    region: frankfurt
    schedule: "0 * * * *"
    startCommand: >
      curl -fsS -X POST "https://$API_HOST/internal/jobs/day-start"
      -H "X-Internal-Token: $CRON_SECRET"
    envVars:
      - key: API_HOST
        fromService:
          name: nicoflow-api-staging
          type: web
          property: host
      - key: CRON_SECRET
        sync: false

  # ── Inbox nudge sweep (E-025 / NIC-1571) ────────────────────────────────────
  # Hourly cron; fires only for Pro users at their local reminder hour. Emits the
  # daily unprocessed-count nudge and the weekly stale-capture warning, both
  # deduped per window, so hourly invocation is safe. Same guard + host wiring.
  - type: cron
    name: nicoflow-inbox-staging
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.1
    region: frankfurt
    schedule: "0 * * * *"
    startCommand: >
      curl -fsS -X POST "https://$API_HOST/internal/jobs/inbox"
      -H "X-Internal-Token: $CRON_SECRET"
    envVars:
      - key: API_HOST
        fromService:
          name: nicoflow-api-staging
          type: web
          property: host
      - key: CRON_SECRET
        sync: false

  # ── End-of-day summary + streak sweep (E-025 / NIC-1572) ─────────────────────
  # Hourly cron; fires only for Pro users at their local 20:00. Emits the daily
  # completion summary and a streak-milestone celebration, both deduped, so hourly
  # invocation is safe. Same guard + host wiring.
  - type: cron
    name: nicoflow-summary-staging
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.1
    region: frankfurt
    schedule: "0 * * * *"
    startCommand: >
      curl -fsS -X POST "https://$API_HOST/internal/jobs/summary"
      -H "X-Internal-Token: $CRON_SECRET"
    envVars:
      - key: API_HOST
        fromService:
          name: nicoflow-api-staging
          type: web
          property: host
      - key: CRON_SECRET
        sync: false
