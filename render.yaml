# Render Blueprint — Nicoflow API (staging)
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions the staging web service + a managed Postgres 16 instance.
# Apply via the Render dashboard: New + → Blueprint → point at this repo.
#
# Notes:
# - DB migrations run automatically on boot (see internal/db/migrate.go); opt out with SKIP_MIGRATIONS=true.
# - Secrets (sync: false) are intentionally left blank here and entered in the dashboard.
# - Production is deliberately omitted for now (staging-first); clone this service block
#   with prod values once staging is verified green.

databases:
  - name: nicoflow-db-staging
    databaseName: nicoflow
    user: nicoflow
    # Region MUST match the web service below — the API connects over Render's private
    # network using the DB's internal hostname, which only resolves within the same region.
    region: frankfurt
    # Paid persistent tier. Legacy plan names (`starter`/`standard`/`pro`) are dead
    # for new Postgres — must use the flexible instance types (`basic-*`/`pro-*`).
    # Matches the dashboard instance type (Basic-256mb); a mismatch fails the sync.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: nicoflow-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Starter (~$7/mo). Was `free`; upgraded in the dashboard, so the blueprint must
    # match — a `free` here conflicts with the live paid service and fails the sync.
    plan: starter
    # Must match the database region above so the internal DB hostname resolves.
    region: frankfurt
    branch: staging
    autoDeploy: true
    healthCheckPath: /v1/health
    envVars:
      # --- wired automatically from the managed database above ---
      - key: DATABASE_URL
        fromDatabase:
          name: nicoflow-db-staging
          property: connectionString

      # --- environment / behaviour ---
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      # Cross-site cookie: frontend (*.vercel.app) and API (*.onrender.com) are different
      # registrable domains, so the refresh cookie must be SameSite=None. Flip to false once
      # both sit on one custom domain (then the cookie returns to SameSite=Strict).
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"

      # Observability (E-038): Sentry error tracking. Absent DSN = no-op, so this
      # stays blank until the epic lands. When cloning this block for the prod
      # service, carry LOG_LEVEL + SENTRY_DSN across.
      - key: SENTRY_DSN
        sync: false

      # --- token TTLs (defaults; here for visibility) ---
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 168h

      # --- secrets / per-environment values: set in the Render dashboard ---
      - key: JWT_SECRET
        sync: false
      # Exact Vercel staging origin, no trailing slash, no wildcard (must match the FE origin):
      - key: CORS_ORIGINS
        sync: false
      # E2E rate-limit bypass token (staging only). A request with header
      # `X-E2E-Bypass: <this>` skips the rate limiters so the live E2E suite
      # isn't throttled. NEVER set this on production. Unset ⇒ no bypass.
      - key: RATE_LIMIT_BYPASS_TOKEN
        sync: false
      # Same Vercel origin — used to build verify-email / reset-password links:
      - key: APP_BASE_URL
        sync: false
      # Mailtrap (or other) SMTP DSN so verification/reset emails are sent:
      - key: SMTP_DSN
        sync: false
      # Shared secret guarding POST /internal/jobs/* — must match the cron job's
      # value below (set the same secret on both in the dashboard). Unset ⇒ the
      # internal endpoints return 503.
      - key: CRON_SECRET
        sync: false
      # Web Push VAPID keys (E-025). Base64url; all three unset ⇒ push no-op.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # AI assistant (E-026). Unset ⇒ the kill switch returns 503 AI_UNAVAILABLE
      # on every /v1/ai/* route (never a silent no-op), and the FE shows its
      # feature-disabled banner. Billed per token on the Anthropic account, so a
      # spend limit there is the real backstop — the app only caps request counts.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Model id. Omit to use the code default (claude-haiku-4-5); only set this
      # to pin or change models deliberately — never hardcode one at a call site.
      - key: AI_MODEL
        sync: false

  # ── Notification sweeps (E-020 / E-025) ─────────────────────────────────────
  # One hourly cron hits the /internal/jobs/run-all endpoint, which runs all five
  # sweeps server-side in sequence. Each sweep decides which users are in their local
  # reminder window and dedupes per window, so hourly invocation is safe/idempotent.
  # One combined cron = a single $1/month floor instead of five.
  #
  # The command is a SINGLE curl (no shell loop): Render's dockerCommand tokenises on
  # whitespace and mangled a quoted `sh -c 'for ...; done'` script (exit 127). One
  # curl has no shell constructs to break, so the curl image works as-is. -f fails the
  # run on any non-2xx. API_HOST is wired from the web service; CRON_SECRET must match
  # the web service's value (set on the cron service in the dashboard).
  - type: cron
    name: nicoflow-notify-staging
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.1
    plan: starter
    region: frankfurt
    schedule: "0 * * * *"
    dockerCommand: 'curl -fsS -X POST "https://$API_HOST/internal/jobs/run-all" -H "X-Internal-Token: $CRON_SECRET"'
    envVars:
      # Public hostname, hardcoded — NOT fromService(property: host), which returns the
      # PRIVATE-network hostname that a cron job can't route to (curl exit 7, connect
      # fails in ~2ms). There is no fromService property for the public .onrender.com
      # host, so it's a literal here. Update if the service's public host changes.
      - key: API_HOST
        value: nicoflow-api-staging.onrender.com
      - key: CRON_SECRET
        sync: false
