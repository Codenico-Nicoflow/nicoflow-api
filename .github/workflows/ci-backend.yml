name: CI — Backend

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nicoflow
          POSTGRES_PASSWORD: nicoflow
          POSTGRES_DB: nicoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nicoflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar -xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        env:
          DATABASE_URL: postgres://nicoflow:nicoflow@localhost:5432/nicoflow_test?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://nicoflow:nicoflow@localhost:5432/nicoflow_test?sslmode=disable
        # -timeout 20m: bcrypt-heavy auth suite under -race approaches Go's default
        # 10m per-package wall on CI runners; 20m adds headroom without hiding a hang.
        run: go test ./... -tags=integration -race -count=1 -timeout 20m -coverprofile=coverage.out -covermode=atomic

      - name: Coverage gate (E-018 in-scope domains + utils)
        # E-018 covers auth/area/project/task/bucket. ai + billing are Phase 4/5
        # (out of scope) and deliberately excluded until their own test epics.
        # Floors sit just under current coverage to catch regressions, not force churn.
        run: |
          go tool cover -func=coverage.out | tee /tmp/cover.txt
          avg() { grep "internal/domain/$1/" /tmp/cover.txt | awk '{gsub(/%/,"",$3); s+=$3; n++} END {if(n>0) printf "%.1f", s/n; else print "0"}'; }
          gate() { local got; got=$(avg "$1"); echo "$1: ${got}% (min $2%)"; awk "BEGIN {if (${got}+0 < $2) {print \"FAIL: $1 coverage ${got}% < $2%\"; exit 1}}"; }
          UTIL=$(grep 'pkg/hashutil\|pkg/jwtutil' /tmp/cover.txt | awk '{gsub(/%/,"",$3); s+=$3; n++} END {if(n>0) printf "%.1f", s/n}')
          gate auth 55
          gate area 80
          gate project 75
          gate task 75
          gate bucket 75
          echo "utils: ${UTIL:-0}% (min 75%)"
          awk "BEGIN {if (${UTIL:-0}+0 < 75) {print \"FAIL: utils coverage ${UTIL}% < 75%\"; exit 1}}"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          gosec ./...

      - name: gitleaks (secret scanning)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-git --exit-code 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  # TODO: ECR push (when AWS ECS migration begins)
  # Add the following steps conditionally on github.ref == 'refs/heads/main':
  #   - uses: aws-actions/configure-aws-credentials@v4
  #     with:
  #       aws-region: us-east-1
  #       role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
  #   - uses: aws-actions/amazon-ecr-login@v2
  # Then set push: true and add ECR tags:
  #   <ECR_REGISTRY>/nicoflow-api:${{ github.sha }}
  #   <ECR_REGISTRY>/nicoflow-api:latest
  docker-build:
    name: Docker Build
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            nicoflow-api:latest
            nicoflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image size < 50MB
        run: |
          SIZE=$(docker image inspect nicoflow-api:latest --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "ERROR: image is ${SIZE_MB}MB, must be < 50MB"
            exit 1
          fi

      - name: Trivy image scan (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nicoflow-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
