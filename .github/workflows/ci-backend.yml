name: CI — Backend

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nicoflow
          POSTGRES_PASSWORD: nicoflow
          POSTGRES_DB: nicoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nicoflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache: true

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://nicoflow:nicoflow@localhost:5432/nicoflow_test?sslmode=disable
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache: true

      - name: Build
        run: go build ./...

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Validate Swagger docs
        run: |
          swag init -g cmd/server/main.go --output docs
          git diff --exit-code docs/

  # TODO: ECR push (when AWS ECS migration begins)
  # Add the following steps conditionally on github.ref == 'refs/heads/main':
  #   - uses: aws-actions/configure-aws-credentials@v4
  #     with:
  #       aws-region: us-east-1
  #       role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
  #   - uses: aws-actions/amazon-ecr-login@v2
  # Then set push: true and add ECR tags:
  #   <ECR_REGISTRY>/nicoflow-api:${{ github.sha }}
  #   <ECR_REGISTRY>/nicoflow-api:latest
  docker-build:
    name: Docker Build
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            nicoflow-api:latest
            nicoflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
